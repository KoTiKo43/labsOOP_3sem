<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WEB-UI: Function Editor</title>

    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="style.css">

    <script src="popper.min.js"></script>
    <script src="bootstrap.min.js"></script>

    <script src="chart.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .table-responsive {
            overflow-x: auto;
        }
    </style>
</head>
<body>
<nav class="navbar bg-dark navbar-expand-lg border-bottom border-body wu-navbar" data-bs-theme="dark">
    <div class="container">
        <span class="navbar-brand mb-0 h1">WEB-UI</span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" aria-current="page" href="index.html">Основные операции</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" aria-current="page" href="diff.html">Дифференцирование</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="function_editor.html">Function Editor</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-3">
    <div class="row">
        <div class="col-md-4">
            <div class="mb-3">
                <button type="button" class="btn btn-primary" onclick="openStep1ModalCreateFunc()">Создать</button>
                <div class="btn-group">
                    <button id="operand_export_button" type="button" class="btn btn-primary" disabled onclick="exportFunc(1)">Сохранить</button>
                    <button type="button" class="btn btn-primary" onclick="openImportFuncModal(1)">Загрузить</button>
                </div>
            </div>
            <div class="table-responsive">
                <table id="operand_table" class="wu-view-tab">
                    <thead>
                    <tr>
                        <th style="width: 10%">#</th>
                        <th style="width: 45%">X</th>
                        <th style="width: 45%">Y</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td>1</td>
                        <td><input data-wu-point="x" type="text" disabled></td>
                        <td><input data-wu-point="y" type="text" disabled></td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td><input data-wu-point="x" type="text" disabled></td>
                        <td><input data-wu-point="y" type="text" disabled></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card">
                <div class="card-body">
                    <canvas id="functionChart"></canvas>
                </div>
            </div>
            <div class="card mb-3">
                <div class="card-body">
                    <div class="mb-3">
                        <label for="applyX" class="form-label">Значение X:</label>
                        <div class="input-group">
                            <input type="number" class="form-control" id="applyX" step="any">
                            <button class="btn btn-primary" onclick="submitApply()">Вычислить</button>
                        </div>
                    </div>
                    <div id="applyResult" class="alert alert-info" style="display:none">
                        Результат: <span id="applyResultValue"></span>
                    </div>
                </div>
            </div>
        </div>

    </div>

</div>

<div class="modal fade" id="modalCreateFuncStep1" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h1 class="modal-title fs-5">Создание функции (1/2)</h1>
                    <small>Настройки фабрики</small>
                </div>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="modalCreateFuncStep1__count" class="form-label">Укажите количество точек</label>
                    <input type="number" class="form-control" id="modalCreateFuncStep1__count" value="2" min="2"
                           pattern="^[0-9]+$" title="Введите целое число, не меньше 2">
                </div>

                <div class="mb-3">
                    <label for="modalCreateFuncStep1__mathFunc" class="form-label">Выберите математическую
                        функцию</label>
                    <select class="form-select" id="modalCreateFuncStep1__mathFunc" onchange="onMCFS1ChangeMathFunc()">
                    </select>
                </div>

                <div class="mb-3" id="modalCreateFuncStep1__additional" style="display: none">
                    <p class="form-label">Укажите интервал разбиения</p>
                    <div class="input-group">
                        <span class="input-group-text">от</span>
                        <input id="modalCreateFuncStep1__xFrom" type="number"
                               class="form-control" pattern="^-?(0|0[\.,][0-9]+|[1-9]+[\.,][0-9]+|[0-9]+)$"
                               title="Введите число с плавающей точкой">
                        <span class="input-group-text">до</span>
                        <input id="modalCreateFuncStep1__xTo" type="number"
                               class="form-control" pattern="^-?(0|0[\.,][0-9]+|[1-9]+[\.,][0-9]+|[0-9]+)$"
                               title="Введите число с плавающей точкой">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="modalCreateFuncStep1__fabric" class="form-label">Какую фабрику использовать</label>
                    <select class="form-select" id="modalCreateFuncStep1__fabric">
                        <option selected value="array">Массив</option>
                        <option value="linked">Связанный список</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link" onclick="cancelModalCreateFunc()">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="nextStep2ModalCreateFunc()">Далее ></button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalCreateFuncStep2" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h1 class="modal-title fs-5">Создание функции (2/2)</h1>
                    <small>Ввод точек</small>
                </div>
            </div>
            <div class="modal-body">
                <table id="modalCreateFuncStep2__table" class="table">
                    <thead>
                    <tr>
                        <th style="width: 10%">#</th>
                        <th style="width: 45%">X</th>
                        <th style="width: 45%">Y</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link" onclick="cancelModalCreateFunc()">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="submitCreateFunc()">Создать</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalImportFunc" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h1 class="modal-title fs-5">Загрузить функцию</h1>
                </div>
            </div>
            <div class="modal-body">
                <input id="modalImportFunc__inputFile" type="file" accept=".bin" class="form-control">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="submitImport()">Загрузить</button>
            </div>
        </div>
    </div>
</div>

<template id="modalCreateFuncStep2__template_row">
    <tr>
        <td>1</td>
        <td><input data-wu-point="x" type="text"></td>
        <td><input data-wu-point="y" type="text"></td>
    </tr>
</template>

<template id="view_table__template_row">
    <tr>
        <td>1</td>
        <td><input data-wu-point="x" type="number" disabled></td>
        <td><input data-wu-point="y" type="number"
                   pattern="^-?(0|0[\.,][0-9]+|[1-9]+[\.,][0-9]+|[0-9]+)$"
                   title="Введите число с плавающей точкой"></td>
    </tr>
</template>
<script src="function_editor.js"></script>
</body>
</html>
